<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Comemoração</title>
<style>
  /* Faixa no topo da tela. Fundo transparente de proposito: o jogo continua
     visivel atras e a metade de baixo fica livre para andar.

     NADA aqui pode depender de requestAnimationFrame. Dentro do iframe
     sobreposto ao jogo o navegador estrangula o rAF, e foi exatamente isso
     que fez o valor da venda nunca aparecer na primeira versao. Animacao e
     so CSS; o JavaScript escreve o texto direto. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }

  .palco { position: relative; height: 100%; display: flex; align-items: center;
    justify-content: center; gap: 20px; padding: 0 18px; }

  .fundo { position: absolute; inset: 0; border-radius: 0 0 18px 18px;
    background: linear-gradient(180deg, var(--cor) 0%, rgba(11,14,12,.93) 76%, transparent 100%);
    opacity: .93; }

  .caras { position: relative; display: flex; align-items: center; gap: 10px; flex: none; }
  .cara { width: 116px; height: 116px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.85);
    background: rgba(0,0,0,.35) center/cover no-repeat;
    animation: entra .55s cubic-bezier(.2,1.5,.4,1) both; }
  .cara.menor { width: 74px; height: 74px; border-width: 2px; opacity: .95;
    animation-delay: .12s; }
  @keyframes entra { from { transform: scale(.4) rotate(-8deg); opacity: 0; } }
  .palco.tambor .cara { animation: pulsa .58s ease-in-out infinite; }
  @keyframes pulsa { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }

  .texto { position: relative; z-index: 1; color: #fff; min-width: 0; }
  .rotulo { font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
    opacity: .85; margin-bottom: 1px; }
  .nome { font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.06;
    text-shadow: 0 2px 14px rgba(0,0,0,.6); }
  .credito { font-size: 15px; opacity: .9; margin-top: 3px; }
  .credito b { font-weight: 600; color: #ffe6a3; }

  .valor { font-weight: 700; letter-spacing: -.03em; line-height: 1;
    font-variant-numeric: tabular-nums; color: #ffdf80;
    text-shadow: 0 3px 22px rgba(0,0,0,.75); margin-top: 4px;
    font-size: 56px; display: none; }
  .palco.revelado .valor { display: block; animation: sobe .4s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes sobe { from { transform: translateY(16px); opacity: 0; } }

  /* Venda grande merece escândalo: maior, pulsando e piscando. */
  .palco.grandiosa .valor { font-size: 84px;
    animation: sobe .4s cubic-bezier(.2,1.5,.4,1) both, bate 1s ease-in-out .4s infinite; }
  @keyframes bate {
    0%, 100% { transform: scale(1);    color: #ffdf80; text-shadow: 0 3px 22px rgba(0,0,0,.75); }
    50%      { transform: scale(1.13); color: #fff8dc; text-shadow: 0 0 34px rgba(255,223,128,.95), 0 3px 22px rgba(0,0,0,.75); }
  }

  .suspense { font-size: 44px; font-weight: 700; color: rgba(255,255,255,.45);
    letter-spacing: .12em; margin-top: 4px; animation: respira 1.1s ease-in-out infinite; }
  @keyframes respira { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
  .palco.revelado .suspense { display: none; }

  .flash { position: absolute; inset: 0; background: #ffdf80; opacity: 0; pointer-events: none; }
  .palco.flash .flash { animation: clarao .6s ease-out; }
  @keyframes clarao { from { opacity: .9; } to { opacity: 0; } }

  .confete { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .confete i { position: absolute; top: -10%; width: 8px; height: 13px; border-radius: 2px;
    animation: cai linear forwards; }
  @keyframes cai { to { transform: translateY(120vh) rotate(720deg); opacity: .1; } }

  @media (prefers-reduced-motion: reduce) {
    .cara, .valor, .suspense { animation: none !important; }
    .confete { display: none; }
  }
</style>
</head>
<body>
<div class="palco" id="palco">
  <div class="fundo"></div>
  <div class="flash"></div>
  <div class="caras">
    <div class="cara" id="cara"></div>
    <div class="cara menor" id="cara2" style="display:none"></div>
  </div>
  <div class="texto">
    <p class="rotulo" id="rotulo">—</p>
    <p class="nome" id="nome">—</p>
    <p class="credito" id="credito" style="display:none"></p>
    <p class="suspense" id="suspense">R$ ? ? ?</p>
    <p class="valor" id="valor"></p>
  </div>
  <div class="confete" id="confete"></div>
</div>

<script>
var q = new URLSearchParams(location.search);
var tipo = q.get("tipo") || "venda";
var quem = q.get("quem") || "Alguém";
var valor = Number(q.get("valor") || 0);
var cor = q.get("cor") || "#C9A227";
var cara = q.get("cara") || "";
var faixa = q.get("faixa") || "pequeno";
var prevendas = q.get("prevendas") || "";
var caraPre = q.get("carapre") || "";

var palco = document.getElementById("palco");
var elValor = document.getElementById("valor");
palco.style.setProperty("--cor", cor);
document.getElementById("nome").textContent = quem;
if (cara) document.getElementById("cara").style.backgroundImage = 'url("' + cara + '")';

var MS_CAIXA = 3000;
var MS_TAMBOR = { pequeno: 3000, medio: 7000, grande: 10000, epico: 10000, lendario: 10000 };
var QTD_CONFETE = { pequeno: 10, medio: 25, grande: 40, epico: 60, lendario: 100 };
var ROTULO = { pequeno: "Venda", medio: "Boa venda", grande: "Venda grande",
               epico: "Venda épica", lendario: "Venda lendária" };

function brl(n) {
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
}

function confete(qtd, cores) {
  var alvo = document.getElementById("confete");
  for (var i = 0; i < qtd; i++) {
    var p = document.createElement("i");
    p.style.left = Math.random() * 100 + "%";
    p.style.background = cores[Math.floor(Math.random() * cores.length)];
    p.style.animationDuration = (2.2 + Math.random() * 2.6) + "s";
    p.style.animationDelay = (Math.random() * 1.2) + "s";
    alvo.appendChild(p);
  }
}

/*
 * Escreve o valor final PRIMEIRO e so entao anima a contagem. Se o
 * navegador estrangular os temporizadores, o numero ja esta na tela — o
 * que nao pode acontecer de novo e a venda aparecer sem o valor.
 */
function revelarValor(fim) {
  elValor.textContent = brl(fim); // o numero certo ja na tela, antes de animar
  var passos = 16, i = 0;
  var t = setInterval(function () {
    i++;
    if (i >= passos) { clearInterval(t); elValor.textContent = brl(fim); return; }
    var p = i / passos;
    elValor.textContent = brl(Math.round(fim * (1 - Math.pow(1 - p, 3))));
  }, 55);
  // Rede de seguranca: se os temporizadores forem estrangulados, o valor
  // final entra na marra antes do painel fechar. Melhor perder a animacao
  // do que mostrar um numero errado.
  setTimeout(function () { clearInterval(t); elValor.textContent = brl(fim); }, 1800);
}

if (tipo === "agendamento") {
  document.getElementById("rotulo").textContent = "Reunião agendada";
  document.getElementById("suspense").style.display = "none";
  confete(18, ["#3fbf7f", "#7fe3b0", "#ffffff"]);
} else {
  document.getElementById("rotulo").textContent = ROTULO[faixa] || "Venda";

  if (prevendas) {
    var c = document.getElementById("credito");
    c.innerHTML = "agendada por <b>" + prevendas.replace(/[<>&]/g, "") + "</b>";
    c.style.display = "block";
    if (caraPre) {
      var c2 = document.getElementById("cara2");
      c2.style.backgroundImage = 'url("' + caraPre + '")';
      c2.style.display = "block";
    }
  }

  setTimeout(function () { palco.classList.add("tambor"); }, MS_CAIXA);

  setTimeout(function () {
    palco.classList.remove("tambor");
    palco.classList.add("revelado");
    if (faixa === "lendario" || faixa === "epico") {
      palco.classList.add("flash", "grandiosa");
    }
    revelarValor(valor);
    confete(QTD_CONFETE[faixa] || 20, ["#C9A227", "#E4C766", "#FFD93D", "#ffffff"]);
  }, MS_CAIXA + (MS_TAMBOR[faixa] || 3000));
}
</script>
</body>
</html>
